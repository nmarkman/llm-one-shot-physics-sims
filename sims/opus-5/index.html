<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Claude Opus 5</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0a0a0f;
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #dbe9f5;
  }
  canvas { display: block; width: 100vw; height: 100vh; }

  /* ---------------- Control panel ---------------- */
  #panel {
    position: fixed;
    top: 16px; left: 16px;
    width: 268px;
    max-height: calc(100vh - 32px);
    overflow-y: auto;
    padding: 14px;
    border-radius: 16px;
    background: rgba(9, 12, 20, 0.72);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    border: 1px solid rgba(100, 200, 255, 0.18);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
    z-index: 10;
    scrollbar-width: thin;
    scrollbar-color: rgba(100,200,255,0.3) transparent;
  }
  #panel::-webkit-scrollbar { width: 8px; }
  #panel::-webkit-scrollbar-thumb {
    background: rgba(100,200,255,0.25); border-radius: 8px;
  }
  #panel::-webkit-scrollbar-track { background: transparent; }

  .title {
    font-size: 13px; font-weight: 700; letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(100, 200, 255, 0.95);
    margin: 2px 2px 12px;
    text-shadow: 0 0 14px rgba(100, 200, 255, 0.45);
  }
  .title small {
    display: block; margin-top: 3px;
    font-size: 10px; font-weight: 500; letter-spacing: 0.06em;
    text-transform: none; color: rgba(190, 215, 235, 0.45);
  }

  .section {
    border: 1px solid rgba(100, 200, 255, 0.10);
    background: rgba(255, 255, 255, 0.022);
    border-radius: 11px;
    margin-bottom: 10px;
    overflow: hidden;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .section:hover { border-color: rgba(100, 200, 255, 0.32); background: rgba(255,255,255,0.04); }
  .section:last-child { margin-bottom: 0; }

  .sec-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px;
    cursor: pointer; user-select: none;
    font-size: 11px; font-weight: 600; letter-spacing: 0.13em;
    text-transform: uppercase;
    color: rgba(160, 215, 250, 0.9);
  }
  .sec-head:hover { color: rgba(190, 235, 255, 1); }
  .chev {
    font-size: 9px; color: rgba(100, 200, 255, 0.7);
    transition: transform 0.25s ease;
  }
  .section.collapsed .chev { transform: rotate(-90deg); }

  .sec-body {
    max-height: 520px; opacity: 1;
    padding: 2px 12px 12px;
    transition: max-height 0.28s ease, opacity 0.2s ease, padding 0.28s ease;
  }
  .section.collapsed .sec-body {
    max-height: 0; opacity: 0; padding-top: 0; padding-bottom: 0;
    overflow: hidden;
  }

  .ctrl { margin: 11px 0; }
  .ctrl:first-child { margin-top: 4px; }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 11px; margin-bottom: 6px;
    color: rgba(205, 225, 240, 0.82);
  }
  .val {
    font-variant-numeric: tabular-nums;
    font-size: 11px; font-weight: 600;
    color: rgba(120, 210, 255, 0.95);
    background: rgba(100, 200, 255, 0.09);
    border: 1px solid rgba(100, 200, 255, 0.16);
    border-radius: 5px; padding: 1px 6px; min-width: 44px; text-align: center;
  }
  .hint {
    margin-top: 5px; font-size: 10px; letter-spacing: 0.08em;
    text-transform: uppercase; color: rgba(150, 200, 235, 0.5);
  }

  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 4px; margin: 0;
    background: rgba(255, 255, 255, 0.10);
    border-radius: 4px; outline: none; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: rgb(120, 210, 255);
    border: 2px solid rgba(10, 14, 22, 0.9);
    box-shadow: 0 0 10px rgba(100, 200, 255, 0.75), 0 0 20px rgba(100, 200, 255, 0.35);
    transition: transform 0.12s ease;
  }
  input[type="range"]:hover::-webkit-slider-thumb { transform: scale(1.18); }
  input[type="range"]::-moz-range-thumb {
    width: 12px; height: 12px; border-radius: 50%;
    background: rgb(120, 210, 255);
    border: 2px solid rgba(10, 14, 22, 0.9);
    box-shadow: 0 0 10px rgba(100, 200, 255, 0.75);
  }

  .switch-row {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 11px; color: rgba(205, 225, 240, 0.82);
    margin: 11px 0 4px;
  }
  .switch { position: relative; display: inline-block; width: 38px; height: 20px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .track {
    position: absolute; inset: 0; cursor: pointer;
    background: rgba(255, 255, 255, 0.10);
    border: 1px solid rgba(255, 255, 255, 0.10);
    border-radius: 20px; transition: 0.22s;
  }
  .track::before {
    content: ""; position: absolute;
    height: 14px; width: 14px; left: 2px; top: 2px;
    background: rgba(220, 235, 245, 0.75);
    border-radius: 50%; transition: 0.22s;
  }
  .switch input:checked + .track {
    background: rgba(100, 200, 255, 0.30);
    border-color: rgba(100, 200, 255, 0.55);
  }
  .switch input:checked + .track::before {
    transform: translateX(18px);
    background: rgb(140, 220, 255);
    box-shadow: 0 0 10px rgba(100, 200, 255, 0.9);
  }

  .btn {
    width: 100%; margin-top: 12px; padding: 9px 10px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgb(160, 225, 255);
    background: linear-gradient(180deg, rgba(100,200,255,0.20), rgba(100,200,255,0.08));
    border: 1px solid rgba(100, 200, 255, 0.35);
    border-radius: 9px; cursor: pointer;
    transition: 0.18s ease;
  }
  .btn:hover {
    color: #eaf8ff;
    background: linear-gradient(180deg, rgba(100,200,255,0.35), rgba(100,200,255,0.16));
    box-shadow: 0 0 18px rgba(100, 200, 255, 0.35);
  }
  .btn:active { transform: translateY(1px); }

  /* ---------------- Tooltip (real DOM node, outside the panel) ---------------- */
  #tooltip {
    position: fixed; top: 0; left: 0;
    max-width: 210px; padding: 7px 10px;
    font-size: 11px; line-height: 1.4;
    color: rgba(225, 240, 250, 0.95);
    background: rgba(12, 16, 26, 0.94);
    border: 1px solid rgba(100, 200, 255, 0.28);
    border-radius: 8px;
    box-shadow: 0 8px 26px rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(8px);
    pointer-events: none;
    opacity: 0; transform: translateX(-6px);
    transition: opacity 0.14s ease, transform 0.14s ease;
    z-index: 100;
  }
  #tooltip.show { opacity: 1; transform: translateX(0); }
</style>
</head>
<body>


<style>
  
  @media (max-width: 768px) {
    #panel, #controls, #controlPanel, #control-panel, .controls, .sidebar {
      width: calc(100vw - 32px) !important;
      max-width: none !important;
      left: 16px !important;
      right: 16px !important;
      max-height: 60vh !important;
      font-size: 0.85rem !important;
    }
  }

  .sim-panel-toggle {
    display: none;
    position: fixed;
    bottom: 16px;
    right: 16px;
    z-index: 9999;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(100,200,255,0.2);
    background: rgba(10, 14, 24, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: rgba(200,220,240,0.8);
    font-size: 1.2rem;
    cursor: pointer;
    box-shadow: 0 2px 12px rgba(0,0,0,0.5);
    align-items: center;
    justify-content: center;
  }
  .sim-panel-toggle:active { transform: scale(0.92); }

  @media (max-width: 768px) {
    
  .sim-panel-toggle { display: flex; }
    #panel.panel-hidden { display: none !important; }
  }

  /* Embed mode: hide toggle + panel */
  .embed-mode .sim-panel-toggle { display: none !important; }
  .embed-mode #panel { display: none !important; }
</style>
<script>
  (function() {
    var isEmbed = new URLSearchParams(location.search).has('embed');
    if (isEmbed) document.documentElement.classList.add('embed-mode');
    
    // Listen for parent show/hide messages
    window.addEventListener('message', function(e) {
      if (e.data === 'show-panel') {
        document.documentElement.classList.remove('embed-mode');
      } else if (e.data === 'hide-panel') {
        document.documentElement.classList.add('embed-mode');
      }
    });

    document.addEventListener('DOMContentLoaded', function() {
      var btn = document.createElement('button');
      btn.className = 'sim-panel-toggle';
      btn.textContent = isEmbed ? '⚙️' : '✕';
      btn.title = 'Toggle controls';
      document.body.appendChild(btn);
      
      var panel = document.querySelector('#panel');
      if (!panel) return;
      if (!isEmbed) {
        // Standalone on mobile: panel visible initially
      }
      
      btn.addEventListener('click', function() {
        panel.classList.toggle('panel-hidden');
        if (isEmbed) {
          document.documentElement.classList.toggle('embed-mode');
        }
        btn.textContent = panel.classList.contains('panel-hidden') || 
          document.documentElement.classList.contains('embed-mode') ? '⚙️' : '✕';
      });
    });
  })();
</script>


<canvas id="c"></canvas>

<div id="panel">
  <div class="title">Polygon Physics<small>spinning frame · 2D ball sim</small></div>

  <!-- SHAPE -->
  <div class="section" data-section>
    <div class="sec-head">Shape <span class="chev">▼</span></div>
    <div class="sec-body">
      <div class="ctrl" data-tip="Number of sides of the spinning frame. 3 = triangle, 20 = near-circle.">
        <div class="row"><span>Sides</span><span class="val" id="sidesVal">8</span></div>
        <input type="range" id="sides" min="3" max="20" step="1" value="8">
        <div class="hint" id="shapeName">Octagon</div>
      </div>
      <div class="ctrl" data-tip="How fast the frame rotates, in radians/sec. Negative values spin it in reverse.">
        <div class="row"><span>Spin Speed</span><span class="val" id="spinVal">0.60</span></div>
        <input type="range" id="spin" min="-3" max="3" step="0.05" value="0.6">
      </div>
    </div>
  </div>

  <!-- BALLS -->
  <div class="section" data-section>
    <div class="sec-head">Balls <span class="chev">▼</span></div>
    <div class="sec-body">
      <div class="ctrl" data-tip="How many balls to simulate. Changing this respawns everything.">
        <div class="row"><span>Count</span><span class="val" id="countVal">40</span></div>
        <input type="range" id="count" min="1" max="200" step="1" value="40">
      </div>
      <div class="ctrl" data-tip="Max random radius added on top of the base size of 6px. 0 makes every ball identical.">
        <div class="row"><span>Size Variation</span><span class="val" id="sizevarVal">10</span></div>
        <input type="range" id="sizevar" min="0" max="40" step="1" value="10">
      </div>
      <div class="ctrl" data-tip="Wall restitution. 0 = dead stop, 1 = perfect bounce, above 1 injects energy.">
        <div class="row"><span>Bounciness</span><span class="val" id="bounceVal">0.80</span></div>
        <input type="range" id="bounce" min="0" max="1.2" step="0.01" value="0.8">
      </div>
      <div class="switch-row" data-tip="Toggle ball-to-ball collisions. When off, balls pass right through each other.">
        <span>Ball Collisions</span>
        <label class="switch"><input type="checkbox" id="collisions" checked><span class="track"></span></label>
      </div>
    </div>
  </div>

  <!-- PHYSICS -->
  <div class="section" data-section>
    <div class="sec-head">Physics <span class="chev">▼</span></div>
    <div class="sec-body">
      <div class="ctrl" data-tip="Direction gravity pulls. 0° is straight down; rotate it to fling balls sideways or up.">
        <div class="row"><span>Gravity Angle</span><span class="val" id="gravAngleVal">0° ↓</span></div>
        <input type="range" id="gravAngle" min="0" max="360" step="1" value="0">
      </div>
      <div class="ctrl" data-tip="Strength of gravity in px/s². Set to 0 for weightless zero-G drifting.">
        <div class="row"><span>Gravity Strength</span><span class="val" id="gravStrVal">800</span></div>
        <input type="range" id="gravStr" min="0" max="1500" step="10" value="800">
      </div>
      <div class="ctrl" data-tip="Multiplies the physics timestep. 0 freezes time, 3× runs everything at triple speed.">
        <div class="row"><span>Time Scale</span><span class="val" id="timeScaleVal">1.00×</span></div>
        <input type="range" id="timeScale" min="0" max="3" step="0.05" value="1">
      </div>
    </div>
  </div>

  <!-- EFFECTS -->
  <div class="section" data-section>
    <div class="sec-head">Effects <span class="chev">▼</span></div>
    <div class="sec-body">
      <div class="switch-row" data-tip="Fades the previous frame instead of clearing it, leaving glowing motion trails.">
        <span>Motion Trails</span>
        <label class="switch"><input type="checkbox" id="trails"><span class="track"></span></label>
      </div>
      <button class="btn" id="explode" data-tip="Kicks every ball with a random 300–800 px/s impulse in a random direction.">Explode</button>
    </div>
  </div>
</div>

<div id="tooltip"></div>

<script src="sim.js"></script>
</body>
</html>
