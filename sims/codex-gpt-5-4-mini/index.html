<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codex (GPT-5.4-Mini)</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --panel: rgba(8, 12, 20, 0.66);
      --panel-2: rgba(10, 14, 24, 0.78);
      --line: rgba(100, 200, 255, 0.16);
      --line-strong: rgba(100, 200, 255, 0.34);
      --text: rgba(234, 246, 255, 0.94);
      --muted: rgba(200, 224, 241, 0.72);
      --accent: rgba(100, 200, 255, 0.98);
      --accent-soft: rgba(100, 200, 255, 0.18);
      --shadow: rgba(0, 0, 0, 0.38);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: radial-gradient(circle at 50% 45%, rgba(28, 46, 64, 0.45), rgba(10, 10, 15, 0.98) 60%), var(--bg);
      overflow: hidden;
      color: var(--text);
      font-family: "Trebuchet MS", "Gill Sans", "Segoe UI", sans-serif;
    }

    body {
      position: relative;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      pointer-events: none;
      background: var(--bg);
    }

    .panel {
      position: fixed;
      top: 12px;
      left: 12px;
      width: min(380px, calc(100vw - 24px));
      max-height: calc(100vh - 24px);
      overflow-y: auto;
      overflow-x: hidden;
      padding: 14px;
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(10, 15, 24, 0.78), rgba(7, 10, 18, 0.62));
      border: 1px solid var(--line);
      box-shadow:
        0 24px 64px var(--shadow),
        inset 0 1px 0 rgba(255, 255, 255, 0.05),
        inset 0 0 0 1px rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(18px) saturate(1.15);
      -webkit-backdrop-filter: blur(18px) saturate(1.15);
      z-index: 10;
      scrollbar-width: thin;
      scrollbar-color: rgba(100, 200, 255, 0.38) rgba(255, 255, 255, 0.04);
    }

    .panel::-webkit-scrollbar {
      width: 10px;
    }

    .panel::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 999px;
    }

    .panel::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, rgba(100, 200, 255, 0.45), rgba(100, 200, 255, 0.18));
      border-radius: 999px;
      border: 2px solid rgba(10, 15, 24, 0.72);
    }

    .panel-head {
      padding: 2px 4px 12px;
      margin-bottom: 8px;
      border-bottom: 1px solid rgba(100, 200, 255, 0.08);
    }

    .eyebrow {
      margin: 0 0 6px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 0.69rem;
      color: rgba(100, 200, 255, 0.72);
    }

    .panel-head h1 {
      margin: 0;
      font-size: 1.25rem;
      line-height: 1.05;
      font-weight: 700;
      color: var(--text);
    }

    .panel-head p {
      margin: 8px 0 0;
      font-size: 0.88rem;
      line-height: 1.45;
      color: var(--muted);
    }

    .section-card {
      margin-top: 10px;
      border-radius: 18px;
      border: 1px solid rgba(100, 200, 255, 0.12);
      background: linear-gradient(180deg, rgba(11, 16, 27, 0.74), rgba(9, 13, 21, 0.6));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.03),
        0 10px 30px rgba(0, 0, 0, 0.18);
      overflow: hidden;
      transition:
        border-color 180ms ease,
        box-shadow 180ms ease,
        transform 180ms ease;
    }

    .section-card:hover {
      border-color: rgba(100, 200, 255, 0.34);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.05),
        0 14px 34px rgba(0, 0, 0, 0.24);
      transform: translateY(-1px);
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      padding: 12px 14px;
      border: 0;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      text-align: left;
      font: inherit;
    }

    .section-title {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .section-title strong {
      font-size: 0.95rem;
      letter-spacing: 0.02em;
    }

    .section-title span {
      font-size: 0.76rem;
      color: var(--muted);
    }

    .chevron {
      flex: 0 0 auto;
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      color: rgba(100, 200, 255, 0.82);
      transition: transform 180ms ease, color 180ms ease, background 180ms ease;
    }

    .chevron::before {
      content: "▾";
      font-size: 1rem;
      line-height: 1;
    }

    .section-card:hover .chevron {
      color: rgba(100, 200, 255, 1);
      background: rgba(100, 200, 255, 0.08);
    }

    .section-card.collapsed .chevron {
      transform: rotate(-90deg);
    }

    .section-body {
      overflow: hidden;
      max-height: 1000px;
      transition: max-height 220ms ease, opacity 180ms ease;
      opacity: 1;
    }

    .section-card.collapsed .section-body {
      max-height: 0;
      opacity: 0;
    }

    .section-inner {
      overflow: hidden;
      padding: 0 14px 14px;
      display: grid;
      gap: 12px;
    }

    .control {
      padding: 10px 11px 11px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(100, 200, 255, 0.08);
      transition: border-color 180ms ease, background 180ms ease, transform 180ms ease;
    }

    .control:hover {
      border-color: rgba(100, 200, 255, 0.24);
      background: rgba(100, 200, 255, 0.045);
      transform: translateY(-1px);
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 9px;
    }

    .control-label {
      font-size: 0.9rem;
      font-weight: 650;
      letter-spacing: 0.01em;
      color: var(--text);
    }

    .value {
      flex: 0 0 auto;
      font-size: 0.8rem;
      color: rgba(100, 200, 255, 0.94);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .value.compact {
      min-width: 64px;
      text-align: right;
    }

    .slider {
      width: 100%;
      height: 26px;
      margin: 0;
      border: 0;
      background: transparent;
      appearance: none;
      outline: none;
      --pct: 50%;
    }

    .slider::-webkit-slider-runnable-track {
      height: 6px;
      border-radius: 999px;
      background:
        linear-gradient(90deg,
          rgba(100, 200, 255, 0.95) 0%,
          rgba(100, 200, 255, 0.95) var(--pct),
          rgba(255, 255, 255, 0.08) var(--pct),
          rgba(255, 255, 255, 0.08) 100%);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.05),
        0 0 0 1px rgba(0, 0, 0, 0.2);
    }

    .slider::-moz-range-track {
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.05),
        0 0 0 1px rgba(0, 0, 0, 0.2);
    }

    .slider::-moz-range-progress {
      height: 6px;
      border-radius: 999px;
      background: rgba(100, 200, 255, 0.95);
    }

    .slider::-webkit-slider-thumb {
      appearance: none;
      width: 18px;
      height: 18px;
      margin-top: -6px;
      border-radius: 50%;
      border: 1px solid rgba(240, 250, 255, 0.85);
      background:
        radial-gradient(circle at 32% 30%, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.24) 34%, rgba(100, 200, 255, 0.98) 58%, rgba(58, 143, 193, 1) 100%);
      box-shadow:
        0 0 0 5px rgba(100, 200, 255, 0.12),
        0 0 16px rgba(100, 200, 255, 0.55),
        0 2px 8px rgba(0, 0, 0, 0.35);
      cursor: pointer;
    }

    .slider::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1px solid rgba(240, 250, 255, 0.85);
      background:
        radial-gradient(circle at 32% 30%, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.24) 34%, rgba(100, 200, 255, 0.98) 58%, rgba(58, 143, 193, 1) 100%);
      box-shadow:
        0 0 0 5px rgba(100, 200, 255, 0.12),
        0 0 16px rgba(100, 200, 255, 0.55),
        0 2px 8px rgba(0, 0, 0, 0.35);
      cursor: pointer;
    }

    .slider:focus-visible::-webkit-slider-thumb,
    .slider:focus-visible::-moz-range-thumb {
      box-shadow:
        0 0 0 6px rgba(100, 200, 255, 0.2),
        0 0 18px rgba(100, 200, 255, 0.65),
        0 2px 8px rgba(0, 0, 0, 0.35);
    }

    .control-note {
      margin-top: 8px;
      font-size: 0.83rem;
      color: rgba(100, 200, 255, 0.88);
      letter-spacing: 0.01em;
      min-height: 1em;
    }

    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .switch {
      position: relative;
      display: inline-flex;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    .switch input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .switch-track {
      position: relative;
      width: 52px;
      height: 28px;
      border-radius: 999px;
      border: 1px solid rgba(100, 200, 255, 0.16);
      background: rgba(255, 255, 255, 0.06);
      box-shadow:
        inset 0 1px 2px rgba(0, 0, 0, 0.2),
        0 0 0 1px rgba(0, 0, 0, 0.12);
      transition: background 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
    }

    .switch-track::before {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.96), rgba(100, 200, 255, 0.96) 75%);
      box-shadow:
        0 0 10px rgba(100, 200, 255, 0.35),
        0 1px 6px rgba(0, 0, 0, 0.35);
      transform: translateX(0);
      transition: transform 180ms ease, background 180ms ease, box-shadow 180ms ease;
    }

    .switch input:checked + .switch-track {
      border-color: rgba(100, 200, 255, 0.42);
      background: rgba(100, 200, 255, 0.16);
      box-shadow:
        inset 0 1px 2px rgba(0, 0, 0, 0.22),
        0 0 16px rgba(100, 200, 255, 0.14);
    }

    .switch input:checked + .switch-track::before {
      transform: translateX(24px);
      box-shadow:
        0 0 12px rgba(100, 200, 255, 0.5),
        0 1px 6px rgba(0, 0, 0, 0.35);
    }

    .toggle-state {
      margin-left: auto;
      font-size: 0.8rem;
      color: rgba(100, 200, 255, 0.86);
      font-variant-numeric: tabular-nums;
    }

    .action-btn {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid rgba(100, 200, 255, 0.2);
      border-radius: 14px;
      background:
        linear-gradient(180deg, rgba(100, 200, 255, 0.18), rgba(54, 126, 170, 0.14)),
        rgba(255, 255, 255, 0.04);
      color: var(--text);
      font: inherit;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 8px 24px rgba(0, 0, 0, 0.18),
        0 0 0 1px rgba(0, 0, 0, 0.08);
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease, filter 160ms ease;
    }

    .action-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(100, 200, 255, 0.42);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.1),
        0 12px 28px rgba(0, 0, 0, 0.22),
        0 0 20px rgba(100, 200, 255, 0.12);
    }

    .action-btn:active {
      transform: translateY(0);
      filter: brightness(0.96);
    }

    .tooltip {
      position: fixed;
      z-index: 20;
      max-width: 240px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(100, 200, 255, 0.18);
      background: rgba(5, 9, 16, 0.92);
      color: rgba(238, 248, 255, 0.94);
      box-shadow:
        0 18px 32px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-size: 0.8rem;
      line-height: 1.4;
      pointer-events: none;
      opacity: 0;
      transform: translateY(2px);
      transition: opacity 120ms ease, transform 120ms ease;
      white-space: normal;
    }

    .tooltip.visible {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 640px) {
      .panel {
        width: calc(100vw - 16px);
        top: 8px;
        left: 8px;
        max-height: calc(100vh - 16px);
        padding: 12px;
        border-radius: 18px;
      }

      .panel-head h1 {
        font-size: 1.12rem;
      }

      .section-header {
        padding: 11px 12px;
      }

      .section-inner {
        padding: 0 12px 12px;
      }
    }
  </style>
</head>
<body>


<style>
  
  @media (max-width: 768px) {
    #panel, #controls, #controlPanel, #control-panel, .controls, .sidebar {
      width: calc(100vw - 32px) !important;
      max-width: none !important;
      left: 16px !important;
      right: 16px !important;
      max-height: 60vh !important;
      font-size: 0.85rem !important;
    }
  }

  .sim-panel-toggle {
    display: none;
    position: fixed;
    bottom: 16px;
    right: 16px;
    z-index: 9999;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(100,200,255,0.2);
    background: rgba(10, 14, 24, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: rgba(200,220,240,0.8);
    font-size: 1.2rem;
    cursor: pointer;
    box-shadow: 0 2px 12px rgba(0,0,0,0.5);
    align-items: center;
    justify-content: center;
  }
  .sim-panel-toggle:active { transform: scale(0.92); }

  @media (max-width: 768px) {
    
  .sim-panel-toggle { display: flex; }
    #panel.panel-hidden { display: none !important; }
  }

  /* Embed mode: hide toggle + panel */
  .embed-mode .sim-panel-toggle { display: none !important; }
  .embed-mode #panel { display: none !important; }
</style>
<script>
  (function() {
    var isEmbed = new URLSearchParams(location.search).has('embed');
    if (isEmbed) document.documentElement.classList.add('embed-mode');
    
    // Listen for parent show/hide messages
    window.addEventListener('message', function(e) {
      if (e.data === 'show-panel') {
        document.documentElement.classList.remove('embed-mode');
      } else if (e.data === 'hide-panel') {
        document.documentElement.classList.add('embed-mode');
      }
    });

    document.addEventListener('DOMContentLoaded', function() {
      var btn = document.createElement('button');
      btn.className = 'sim-panel-toggle';
      btn.textContent = isEmbed ? '⚙️' : '✕';
      btn.title = 'Toggle controls';
      document.body.appendChild(btn);
      
      var panel = document.querySelector('#panel');
      if (!panel) return;
      if (!isEmbed) {
        // Standalone on mobile: panel visible initially
      }
      
      btn.addEventListener('click', function() {
        panel.classList.toggle('panel-hidden');
        if (isEmbed) {
          document.documentElement.classList.toggle('embed-mode');
        }
        btn.textContent = panel.classList.contains('panel-hidden') || 
          document.documentElement.classList.contains('embed-mode') ? '⚙️' : '✕';
      });
    });
  })();
</script>

  <canvas id="sim" aria-hidden="true"></canvas>

  <main class="panel" id="panel">
    <div class="panel-head">
      <div class="eyebrow">Physics Sandbox</div>
      <h1>Spinning Polygon Arena</h1>
      <p>Gravity, wall drag from rotation, and ball-to-ball collisions inside a live regular polygon.</p>
    </div>

    <section class="section-card" data-section="shape">
      <button class="section-header" type="button" aria-expanded="true">
        <div class="section-title">
          <strong>Shape</strong>
          <span>Polygon geometry and spin</span>
        </div>
        <span class="chevron" aria-hidden="true"></span>
      </button>
      <div class="section-body">
        <div class="section-inner">
          <div class="control" data-tip="Sets the number of polygon edges. Changing it rebuilds the frame and respawns the balls.">
            <div class="control-row">
              <label class="control-label" for="sides">Sides</label>
              <span class="value compact" id="sidesValue">8</span>
            </div>
            <input class="slider" id="sides" type="range" min="3" max="20" step="1" value="8" />
            <div class="control-note" id="shapeName">Octagon</div>
          </div>

          <div class="control" data-tip="Changes how fast the frame rotates. Negative values reverse the spin.">
            <div class="control-row">
              <label class="control-label" for="spinSpeed">Spin Speed</label>
              <span class="value compact" id="spinValue">0.85 rad/s</span>
            </div>
            <input class="slider" id="spinSpeed" type="range" min="-3" max="3" step="0.01" value="0.85" />
          </div>
        </div>
      </div>
    </section>

    <section class="section-card" data-section="balls">
      <button class="section-header" type="button" aria-expanded="true">
        <div class="section-title">
          <strong>Balls</strong>
          <span>Population and collision response</span>
        </div>
        <span class="chevron" aria-hidden="true"></span>
      </button>
      <div class="section-body">
        <div class="section-inner">
          <div class="control" data-tip="Sets how many balls are active. Changing it respawns the entire swarm.">
            <div class="control-row">
              <label class="control-label" for="count">Count</label>
              <span class="value compact" id="countValue">40</span>
            </div>
            <input class="slider" id="count" type="range" min="1" max="200" step="1" value="40" />
          </div>

          <div class="control" data-tip="Adds up to this many pixels to the 6 px base radius when respawning balls.">
            <div class="control-row">
              <label class="control-label" for="sizeVariation">Size Variation</label>
              <span class="value compact" id="sizeValue">+18 px</span>
            </div>
            <input class="slider" id="sizeVariation" type="range" min="0" max="40" step="1" value="18" />
          </div>

          <div class="control" data-tip="Controls how much speed balls keep when they hit the spinning walls.">
            <div class="control-row">
              <label class="control-label" for="bounciness">Bounciness</label>
              <span class="value compact" id="bounceValue">0.90</span>
            </div>
            <input class="slider" id="bounciness" type="range" min="0" max="1.2" step="0.01" value="0.9" />
          </div>

          <div class="control" data-tip="When off, balls ignore one another and pass through.">
            <div class="switch-row">
              <div class="control-label">Ball Collisions</div>
              <label class="switch" for="ballCollisions">
                <input id="ballCollisions" type="checkbox" checked />
                <span class="switch-track" aria-hidden="true"></span>
              </label>
              <span class="toggle-state" id="ballCollisionState">On</span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="section-card" data-section="physics">
      <button class="section-header" type="button" aria-expanded="true">
        <div class="section-title">
          <strong>Physics</strong>
          <span>Gravity and simulation timing</span>
        </div>
        <span class="chevron" aria-hidden="true"></span>
      </button>
      <div class="section-body">
        <div class="section-inner">
          <div class="control" data-tip="Sets the direction gravity pulls, using screen-space compass directions.">
            <div class="control-row">
              <label class="control-label" for="gravityAngle">Gravity Angle</label>
              <span class="value compact" id="angleValue">↓ 90°</span>
            </div>
            <input class="slider" id="gravityAngle" type="range" min="0" max="360" step="1" value="90" />
            <div class="control-note" id="gravityArrow">↓</div>
          </div>

          <div class="control" data-tip="Sets how hard gravity pulls the balls. Zero gives you zero-G.">
            <div class="control-row">
              <label class="control-label" for="gravityStrength">Gravity Strength</label>
              <span class="value compact" id="gravityValue">500</span>
            </div>
            <input class="slider" id="gravityStrength" type="range" min="0" max="1500" step="1" value="500" />
          </div>

          <div class="control" data-tip="Scales the simulation speed. Zero freezes the physics.">
            <div class="control-row">
              <label class="control-label" for="timeScale">Time Scale</label>
              <span class="value compact" id="timeValue">1.00x</span>
            </div>
            <input class="slider" id="timeScale" type="range" min="0" max="3" step="0.01" value="1" />
          </div>
        </div>
      </div>
    </section>

    <section class="section-card" data-section="effects">
      <button class="section-header" type="button" aria-expanded="true">
        <div class="section-title">
          <strong>Effects</strong>
          <span>Presentation and burst energy</span>
        </div>
        <span class="chevron" aria-hidden="true"></span>
      </button>
      <div class="section-body">
        <div class="section-inner">
          <div class="control" data-tip="Leaves fading trails by drawing a semi-transparent black rect instead of clearing the frame.">
            <div class="switch-row">
              <div class="control-label">Motion Trails</div>
              <label class="switch" for="motionTrails">
                <input id="motionTrails" type="checkbox" />
                <span class="switch-track" aria-hidden="true"></span>
              </label>
              <span class="toggle-state" id="motionTrailsState">Off</span>
            </div>
          </div>

          <div class="control" data-tip="Gives every ball a random 300-800 velocity burst.">
            <button id="explode" class="action-btn" type="button">Explode</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="tooltip" class="tooltip" role="tooltip" aria-hidden="true"></div>

  <script src="sim.js"></script>
</body>
</html>
