<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Claude 3 Haiku</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0a0a0f;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    .control-panel {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 300px;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      background-color: rgba(10, 10, 15, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(100, 200, 255, 0.2);
      border-radius: 10px;
      padding: 20px;
      box-sizing: border-box;
      z-index: 1;
    }

    .control-panel h3 {
      color: rgba(100, 200, 255, 0.8);
      margin-top: 0;
      margin-bottom: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .control-panel h3:hover {
      color: rgba(100, 200, 255, 1);
    }

    .control-panel h3 .chevron {
      font-size: 20px;
      transition: transform 0.3s;
    }

    .control-panel h3.collapsed .chevron {
      transform: rotate(-90deg);
    }

    .control-panel .card {
      background-color: rgba(15, 15, 20, 0.8);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid rgba(100, 200, 255, 0.1);
    }

    .control-panel .card:hover {
      border-color: rgba(100, 200, 255, 0.3);
    }

    .control-panel label {
      color: rgba(200, 200, 200, 0.8);
      display: block;
      margin-bottom: 5px;
    }

    .control-panel input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 8px;
      background-color: rgba(50, 50, 50, 0.5);
      border-radius: 4px;
      outline: none;
      opacity: 0.7;
      -webkit-transition: .2s;
      transition: opacity .2s;
    }

    .control-panel input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      background-color: rgba(100, 200, 255, 0.8);
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(100, 200, 255, 0.5);
      cursor: pointer;
    }

    .control-panel input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      background-color: rgba(100, 200, 255, 0.8);
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(100, 200, 255, 0.5);
      cursor: pointer;
    }

    .control-panel .toggle-switch {
      display: inline-block;
      position: relative;
      width: 40px;
      height: 20px;
    }

    .control-panel .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .control-panel .toggle-switch .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(50, 50, 50, 0.5);
      -webkit-transition: .4s;
      transition: .4s;
      border-radius: 20px;
    }

    .control-panel .toggle-switch .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 2px;
      bottom: 2px;
      background-color: rgba(100, 200, 255, 0.8);
      -webkit-transition: .4s;
      transition: .4s;
      border-radius: 50%;
    }

    .control-panel .toggle-switch input:checked + .slider:before {
      -webkit-transform: translateX(20px);
      -ms-transform: translateX(20px);
      transform: translateX(20px);
    }

    .control-panel button {
      background-color: rgba(100, 200, 255, 0.8);
      color: #0a0a0f;
      border: none;
      border-radius: 4px;
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .control-panel button:hover {
      background-color: rgba(100, 200, 255, 1);
    }

    .tooltip {
      position: absolute;
      background-color: rgba(15, 15, 20, 0.8);
      color: rgba(200, 200, 200, 0.8);
      border-radius: 4px;
      padding: 8px;
      font-size: 12px;
      pointer-events: none;
      z-index: 2;
    }
  </style>
</head>
<body>


<style>
  
  @media (max-width: 768px) {
    #panel, #controls, #controlPanel, #control-panel, .controls, .sidebar {
      width: calc(100vw - 32px) !important;
      max-width: none !important;
      left: 16px !important;
      right: 16px !important;
      max-height: 60vh !important;
      font-size: 0.85rem !important;
    }
  }

  .sim-panel-toggle {
    display: none;
    position: fixed;
    bottom: 16px;
    right: 16px;
    z-index: 9999;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(100,200,255,0.2);
    background: rgba(10, 14, 24, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: rgba(200,220,240,0.8);
    font-size: 1.2rem;
    cursor: pointer;
    box-shadow: 0 2px 12px rgba(0,0,0,0.5);
    align-items: center;
    justify-content: center;
  }
  .sim-panel-toggle:active { transform: scale(0.92); }

  @media (max-width: 768px) {
    
  @media (max-width: 768px) {
    #panel, #controls, #controlPanel, #control-panel, .controls, .sidebar {
      width: calc(100vw - 32px) !important;
      max-width: none !important;
      left: 16px !important;
      right: 16px !important;
      max-height: 60vh !important;
      font-size: 0.85rem !important;
    }
  }

  .sim-panel-toggle { display: flex; }
    .control-panel.panel-hidden { display: none !important; }
  }

  /* Embed mode: hide toggle + panel */
  .embed-mode .sim-panel-toggle { display: none !important; }
  .embed-mode .control-panel { display: none !important; }
</style>
<script>
  (function() {
    var isEmbed = new URLSearchParams(location.search).has('embed');
    if (isEmbed) document.documentElement.classList.add('embed-mode');
    
    // Listen for parent show/hide messages
    window.addEventListener('message', function(e) {
      if (e.data === 'show-panel') {
        document.documentElement.classList.remove('embed-mode');
      } else if (e.data === 'hide-panel') {
        document.documentElement.classList.add('embed-mode');
      }
    });

    document.addEventListener('DOMContentLoaded', function() {
      var btn = document.createElement('button');
      btn.className = 'sim-panel-toggle';
      btn.textContent = isEmbed ? '⚙️' : '✕';
      btn.title = 'Toggle controls';
      document.body.appendChild(btn);
      
      var panel = document.querySelector('.control-panel');
      if (!panel) return;
      if (!isEmbed) {
        // Standalone on mobile: panel visible initially
      }
      
      btn.addEventListener('click', function() {
        panel.classList.toggle('panel-hidden');
        if (isEmbed) {
          document.documentElement.classList.toggle('embed-mode');
        }
        btn.textContent = panel.classList.contains('panel-hidden') || 
          document.documentElement.classList.contains('embed-mode') ? '⚙️' : '✕';
      });
    });
  })();
</script>

  <canvas id="simulation-canvas"></canvas>
  <div class="control-panel">
    <div class="card">
      <h3 class="collapsed">Shape <span class="chevron">›</span></h3>
      <div>
        <label for="sides">Sides</label>
        <input type="range" id="sides" min="3" max="20" value="8" />
        <span id="shape-name"></span>
        <label for="spin-speed">Spin Speed</label>
        <input type="range" id="spin-speed" min="-3" max="3" value="1" step="0.1" />
      </div>
    </div>
    <div class="card">
      <h3 class="collapsed">Balls <span class="chevron">›</span></h3>
      <div>
        <label for="ball-count">Count</label>
        <input type="range" id="ball-count" min="1" max="200" value="40" />
        <label for="size-variation">Size Variation</label>
        <input type="range" id="size-variation" min="0" max="40" value="10" />
        <label for="bounciness">Bounciness</label>
        <input type="range" id="bounciness" min="0" max="1.2" value="0.9" step="0.01" />
        <label for="ball-collisions">Ball Collisions</label>
        <div class="toggle-switch">
          <input type="checkbox" id="ball-collisions" checked />
          <span class="slider"></span>
        </div>
      </div>
    </div>
    <div class="card">
      <h3 class="collapsed">Physics <span class="chevron">›</span></h3>
      <div>
        <label for="gravity-angle">Gravity Angle</label>
        <input type="range" id="gravity-angle" min="0" max="360" value="270" />
        <span id="gravity-arrow"></span>
        <label for="gravity-strength">Gravity Strength</label>
        <input type="range" id="gravity-strength" min="0" max="1500" value="500" />
        <label for="time-scale">Time Scale</label>
        <input type="range" id="time-scale" min="0" max="3" value="1" step="0.1" />
      </div>
    </div>
    <div class="card">
      <h3 class="collapsed">Effects <span class="chevron">›</span></h3>
      <div>
        <label for="motion-trails">Motion Trails</label>
        <div class="toggle-switch">
          <input type="checkbox" id="motion-trails" checked />
          <span class="slider"></span>
        </div>
        <button id="explode-button">Explode</button>
      </div>
    </div>
  </div>
  <div id="tooltip" class="tooltip"></div>
  <script src="sim.js"></script>
</body>
</html>
