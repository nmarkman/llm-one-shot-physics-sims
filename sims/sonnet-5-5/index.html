<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Sonnet 5.5</title>
<style>
  :root {
    --accent: 100, 200, 255;
    --bg: #0a0a0f;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: #dbe9f4;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* ---------- Glass panel ---------- */
  #panel {
    position: fixed;
    top: 16px;
    left: 16px;
    width: min(280px, calc(100vw - 32px));
    max-height: calc(100vh - 32px);
    overflow-y: auto;
    padding: 10px;
    z-index: 10;
    background: rgba(10, 14, 22, 0.58);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    backdrop-filter: blur(16px) saturate(140%);
    border: 1px solid rgba(var(--accent), 0.2);
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.04);
    scrollbar-width: thin;
    scrollbar-color: rgba(var(--accent), 0.35) transparent;
  }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(var(--accent), 0.3); border-radius: 3px; }

  /* ---------- Collapsible section cards ---------- */
  .section {
    background: rgba(255, 255, 255, 0.025);
    border: 1px solid rgba(var(--accent), 0.12);
    border-radius: 12px;
    margin-bottom: 8px;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .section:last-child { margin-bottom: 0; }
  .section:hover {
    border-color: rgba(var(--accent), 0.45);
    background: rgba(255, 255, 255, 0.04);
  }

  .section-header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 11px 12px;
    background: none;
    border: none;
    color: rgba(var(--accent), 0.95);
    font: 600 11px/1 inherit;
    font-family: inherit;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    cursor: pointer;
    text-align: left;
  }
  .section-header:focus-visible {
    outline: 2px solid rgba(var(--accent), 0.7);
    outline-offset: -2px;
    border-radius: 12px;
  }

  .chevron {
    width: 7px;
    height: 7px;
    border-right: 2px solid currentColor;
    border-bottom: 2px solid currentColor;
    transform: rotate(45deg) translate(-2px, -2px);
    transition: transform 0.25s ease;
  }
  .section.collapsed .chevron { transform: rotate(-45deg); }

  .section-body {
    display: grid;
    grid-template-rows: 1fr;
    transition: grid-template-rows 0.28s ease;
  }
  .section.collapsed .section-body { grid-template-rows: 0fr; }
  .section-inner { overflow: hidden; min-height: 0; }
  .section.collapsed .section-inner {
    visibility: hidden;
    transition: visibility 0s linear 0.28s;
  }
  .section-content { padding: 0 12px 8px; }

  /* ---------- Controls ---------- */
  .control { padding: 9px 0; }
  .control + .control { border-top: 1px solid rgba(255, 255, 255, 0.05); }

  .control-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
    font-size: 12px;
  }
  .control-label { color: #b9cad8; font-size: 12px; }
  .control-value {
    color: rgb(var(--accent));
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .control-sub {
    margin-top: 7px;
    font-size: 11px;
    text-align: center;
    letter-spacing: 0.06em;
    color: rgba(var(--accent), 0.7);
  }

  .control.toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  /* ---------- Sliders ---------- */
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 18px;
    margin: 0;
    background: transparent;
    cursor: pointer;
    --fill: 50%;
  }
  input[type="range"]:focus { outline: none; }

  input[type="range"]::-webkit-slider-runnable-track {
    height: 4px;
    border-radius: 2px;
    background: linear-gradient(to right,
      rgba(var(--accent), 0.85) var(--fill),
      rgba(255, 255, 255, 0.12) var(--fill));
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    margin-top: -5px;
    border-radius: 50%;
    background: rgb(var(--accent));
    border: 2px solid var(--bg);
    box-shadow: 0 0 0 1px rgba(var(--accent), 0.6), 0 0 10px rgba(var(--accent), 0.8);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  input[type="range"]:hover::-webkit-slider-thumb,
  input[type="range"]:focus-visible::-webkit-slider-thumb {
    transform: scale(1.18);
    box-shadow: 0 0 0 1px rgba(var(--accent), 0.8), 0 0 16px rgba(var(--accent), 1);
  }

  input[type="range"]::-moz-range-track {
    height: 4px;
    border-radius: 2px;
    background: linear-gradient(to right,
      rgba(var(--accent), 0.85) var(--fill),
      rgba(255, 255, 255, 0.12) var(--fill));
  }
  input[type="range"]::-moz-range-thumb {
    box-sizing: border-box;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: rgb(var(--accent));
    border: 2px solid var(--bg);
    box-shadow: 0 0 0 1px rgba(var(--accent), 0.6), 0 0 10px rgba(var(--accent), 0.8);
  }

  /* ---------- Toggle switch ---------- */
  .switch { position: relative; width: 40px; height: 22px; flex: none; }
  .switch input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: pointer;
    z-index: 1;
  }
  .switch .track {
    position: absolute;
    inset: 0;
    border-radius: 11px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.14);
    transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
  }
  .switch .track::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #9fb3c2;
    transition: transform 0.2s ease, background 0.2s, box-shadow 0.2s;
  }
  .switch input:checked + .track {
    background: rgba(var(--accent), 0.28);
    border-color: rgba(var(--accent), 0.7);
    box-shadow: 0 0 10px rgba(var(--accent), 0.3);
  }
  .switch input:checked + .track::after {
    transform: translateX(18px);
    background: rgb(var(--accent));
    box-shadow: 0 0 8px rgba(var(--accent), 0.9);
  }
  .switch input:focus-visible + .track {
    outline: 2px solid rgba(var(--accent), 0.8);
    outline-offset: 2px;
  }

  /* ---------- Action button ---------- */
  .btn {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid rgba(var(--accent), 0.5);
    background: linear-gradient(180deg, rgba(var(--accent), 0.24), rgba(var(--accent), 0.08));
    color: #e8f6ff;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: box-shadow 0.2s, border-color 0.2s, transform 0.1s, background 0.2s;
  }
  .btn:hover {
    border-color: rgba(var(--accent), 0.95);
    box-shadow: 0 0 18px rgba(var(--accent), 0.4);
    background: linear-gradient(180deg, rgba(var(--accent), 0.34), rgba(var(--accent), 0.14));
  }
  .btn:active { transform: translateY(1px) scale(0.99); }
  .btn:focus-visible { outline: 2px solid rgba(var(--accent), 0.8); outline-offset: 2px; }

  /* ---------- Tooltip (real DOM element, lives outside the panel) ---------- */
  #tooltip {
    position: fixed;
    left: 0;
    top: 0;
    width: max-content;
    max-width: 230px;
    padding: 8px 11px;
    font-size: 12px;
    line-height: 1.45;
    color: #e6f3fb;
    background: rgba(10, 14, 22, 0.95);
    border: 1px solid rgba(var(--accent), 0.35);
    border-radius: 8px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5), 0 0 14px rgba(var(--accent), 0.12);
    pointer-events: none;
    opacity: 0;
    transform: translateX(-4px);
    transition: opacity 0.12s ease, transform 0.12s ease;
    z-index: 1000;
  }
  #tooltip.visible { opacity: 1; transform: none; }
</style>
</head>
<body>


<style>
  
  @media (max-width: 768px) {
    #panel, #controls, #controlPanel, #control-panel, .controls, .sidebar {
      width: calc(100vw - 32px) !important;
      max-width: none !important;
      left: 16px !important;
      right: 16px !important;
      max-height: 60vh !important;
      font-size: 0.85rem !important;
    }
  }

  .sim-panel-toggle {
    display: none;
    position: fixed;
    bottom: 16px;
    right: 16px;
    z-index: 9999;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(100,200,255,0.2);
    background: rgba(10, 14, 24, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: rgba(200,220,240,0.8);
    font-size: 1.2rem;
    cursor: pointer;
    box-shadow: 0 2px 12px rgba(0,0,0,0.5);
    align-items: center;
    justify-content: center;
  }
  .sim-panel-toggle:active { transform: scale(0.92); }

  @media (max-width: 768px) {
    
  .sim-panel-toggle { display: flex; }
    #panel.panel-hidden { display: none !important; }
  }

  /* Embed mode: hide toggle + panel */
  .embed-mode .sim-panel-toggle { display: none !important; }
  .embed-mode #panel { display: none !important; }
</style>
<script>
  (function() {
    var isEmbed = new URLSearchParams(location.search).has('embed');
    if (isEmbed) document.documentElement.classList.add('embed-mode');
    
    // Listen for parent show/hide messages
    window.addEventListener('message', function(e) {
      if (e.data === 'show-panel') {
        document.documentElement.classList.remove('embed-mode');
      } else if (e.data === 'hide-panel') {
        document.documentElement.classList.add('embed-mode');
      }
    });

    document.addEventListener('DOMContentLoaded', function() {
      var btn = document.createElement('button');
      btn.className = 'sim-panel-toggle';
      btn.textContent = isEmbed ? '⚙️' : '✕';
      btn.title = 'Toggle controls';
      document.body.appendChild(btn);
      
      var panel = document.querySelector('#panel');
      if (!panel) return;
      if (!isEmbed) {
        // Standalone on mobile: panel visible initially
      }
      
      btn.addEventListener('click', function() {
        panel.classList.toggle('panel-hidden');
        if (isEmbed) {
          document.documentElement.classList.toggle('embed-mode');
        }
        btn.textContent = panel.classList.contains('panel-hidden') || 
          document.documentElement.classList.contains('embed-mode') ? '⚙️' : '✕';
      });
    });
  })();
</script>
  <canvas id="sim"></canvas>

  <aside id="panel">

    <!-- SHAPE -->
    <section class="section">
      <button class="section-header" type="button" aria-expanded="true">
        <span>Shape</span><span class="chevron" aria-hidden="true"></span>
      </button>
      <div class="section-body"><div class="section-inner"><div class="section-content">

        <div class="control" data-tip="Number of sides on the spinning frame. Fewer sides mean sharper corners and a tighter space. Changing this resets the balls.">
          <div class="control-head">
            <label class="control-label" for="sides">Sides</label>
            <span class="control-value" id="sidesVal">8</span>
          </div>
          <input type="range" id="sides" min="3" max="20" step="1" value="8">
          <div class="control-sub" id="shapeName">Octagon</div>
        </div>

        <div class="control" data-tip="How fast the frame rotates. Negative values spin it the other way. Moving walls drag and fling the balls.">
          <div class="control-head">
            <label class="control-label" for="spin">Spin Speed</label>
            <span class="control-value" id="spinVal">0.5</span>
          </div>
          <input type="range" id="spin" min="-3" max="3" step="0.1" value="0.5">
        </div>

      </div></div></div>
    </section>

    <!-- BALLS -->
    <section class="section">
      <button class="section-header" type="button" aria-expanded="true">
        <span>Balls</span><span class="chevron" aria-hidden="true"></span>
      </button>
      <div class="section-body"><div class="section-inner"><div class="section-content">

        <div class="control" data-tip="How many balls bounce inside the frame. Changing this resets the balls.">
          <div class="control-head">
            <label class="control-label" for="count">Count</label>
            <span class="control-value" id="countVal">40</span>
          </div>
          <input type="range" id="count" min="1" max="200" step="1" value="40">
        </div>

        <div class="control" data-tip="Maximum random radius added to the base ball size of 6. Higher values give a wider mix of big and small balls. Changing this resets the balls.">
          <div class="control-head">
            <label class="control-label" for="sizeVar">Size Variation</label>
            <span class="control-value" id="sizeVarVal">14</span>
          </div>
          <input type="range" id="sizeVar" min="0" max="40" step="1" value="14">
        </div>

        <div class="control" data-tip="Wall restitution. 0 absorbs impacts, 1 is perfectly elastic, and above 1 adds energy with every bounce.">
          <div class="control-head">
            <label class="control-label" for="bounce">Bounciness</label>
            <span class="control-value" id="bounceVal">0.80</span>
          </div>
          <input type="range" id="bounce" min="0" max="1.2" step="0.05" value="0.8">
        </div>

        <div class="control toggle" data-tip="When off, balls pass straight through each other and only collide with the walls.">
          <label class="control-label" for="collisions">Ball Collisions</label>
          <label class="switch">
            <input type="checkbox" id="collisions" checked>
            <span class="track"></span>
          </label>
        </div>

      </div></div></div>
    </section>

    <!-- PHYSICS -->
    <section class="section">
      <button class="section-header" type="button" aria-expanded="true">
        <span>Physics</span><span class="chevron" aria-hidden="true"></span>
      </button>
      <div class="section-body"><div class="section-inner"><div class="section-content">

        <div class="control" data-tip="Direction gravity pulls. 0° is straight down, and the angle rotates clockwise.">
          <div class="control-head">
            <label class="control-label" for="gravAngle">Gravity Angle</label>
            <span class="control-value" id="gravAngleVal">0° ↓</span>
          </div>
          <input type="range" id="gravAngle" min="0" max="360" step="1" value="0">
        </div>

        <div class="control" data-tip="How hard gravity pulls. Set it to 0 for zero gravity.">
          <div class="control-head">
            <label class="control-label" for="gravStrength">Gravity Strength</label>
            <span class="control-value" id="gravStrengthVal">800</span>
          </div>
          <input type="range" id="gravStrength" min="0" max="1500" step="10" value="800">
        </div>

        <div class="control" data-tip="Scales the physics time step. Below 1× is slow motion, above 1× is fast-forward, and 0 freezes everything.">
          <div class="control-head">
            <label class="control-label" for="timeScale">Time Scale</label>
            <span class="control-value" id="timeScaleVal">1.0×</span>
          </div>
          <input type="range" id="timeScale" min="0" max="3" step="0.1" value="1">
        </div>

      </div></div></div>
    </section>

    <!-- EFFECTS -->
    <section class="section">
      <button class="section-header" type="button" aria-expanded="true">
        <span>Effects</span><span class="chevron" aria-hidden="true"></span>
      </button>
      <div class="section-body"><div class="section-inner"><div class="section-content">

        <div class="control toggle" data-tip="Leaves fading motion trails instead of fully clearing the canvas each frame.">
          <label class="control-label" for="trails">Motion Trails</label>
          <label class="switch">
            <input type="checkbox" id="trails">
            <span class="track"></span>
          </label>
        </div>

        <div class="control" data-tip="Gives every ball a random velocity kick between 300 and 800 in a random direction.">
          <button class="btn" id="explode" type="button">Explode</button>
        </div>

      </div></div></div>
    </section>

  </aside>

  <!-- Tooltip lives outside the panel so overflow clipping can't hide it -->
  <div id="tooltip" role="tooltip"></div>

  <script src="sim.js"></script>
</body>
</html>
